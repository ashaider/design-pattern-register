<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Design Pattern Register</title>
    <link rel="stylesheet" href="globals.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--foreground);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
        }

        p.subtitle {
            color: #555;
            margin-top: 4px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        /* Buttons */
        .btn {
            background: var(--primary);
            color: var(--primary-foreground);
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #ddd;
            table-layout: fixed;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        th:nth-child(1),
        td:nth-child(1) {
            width: 20%;
        }

        /* Name */
        th:nth-child(2),
        td:nth-child(2) {
            width: 10%;
        }

        /* Type */
        th:nth-child(3),
        td:nth-child(3) {
            width: 40%;
        }

        /* Intent */
        th:nth-child(4),
        td:nth-child(4) {
            width: 15%;
        }

        /* Author */
        th:nth-child(5),
        td:nth-child(5) {
            width: 10%;
        }

        /* Date Created */
        th:nth-child(6),
        td:nth-child(6) {
            width: 10%;
        }

        th {
            font-weight: 600;
        }

        tr:hover {
            background: #f8fafc;
            cursor: pointer;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge.creational {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge.structural {
            background: #d1fae5;
            color: #065f46;
        }

        .badge.behavioral {
            background: #ede9fe;
            color: #5b21b6;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .action-btn {
            padding: 6px 10px;
            background: #eee;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            font-size: 12px;
        }

        .action-btn.delete {
            background: #ffdddd;
            color: red;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="top-bar">
            <div>
                <h1>Design Pattern Register</h1>
                <p class="subtitle">Manage and organize your design patterns</p>
            </div>

            <button class="btn" onclick="window.location.href='pattern.html'">➕ Create New Pattern</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Pattern Name</th>
                    <th>Type</th>
                    <th>Intent</th>
                    <th>Author</th>
                    <th>Date Created</th>
                    <th style="text-align:right;">Actions</th>
                </tr>
            </thead>
            <tbody id="pattern-list"></tbody>
        </table>

    </div>

    <script>
        async function loadPatterns() {
            const res = await fetch('/patterns');
            const patterns = await res.json();
            const list = document.getElementById('pattern-list');

            if (patterns.length === 0) {
                list.innerHTML = `<tr><td colspan="6" class="no-data">No design patterns yet. Create your first pattern.</td></tr>`;
                return;
            }

            list.innerHTML = '';

            patterns.forEach(p => {
                const tr = document.createElement('tr');

                // row click (except on the action buttons like edit/delete)
                tr.addEventListener('click', (e) => {
                    if (!e.target.closest('.actions')) {
                        window.location.href = `view.html?id=${p.id}`;
                    }
                });

                const shortIntent = p.intent && p.intent.length > 50
                    ? p.intent.substring(0, 50) + "…"
                    : (p.intent || "");

                tr.innerHTML = `
      <td>${p.name}</td>
      <td>
        <span class="badge ${p.type === "Creational" ? "creational" :
                        p.type === "Structural" ? "structural" : "behavioral"
                    }">${p.type}</span>
      </td>
      <td>${shortIntent}</td>
      <td>${p.author || "N/A"}</td>
      <td>${formatDate(p.created_at) || ""}</td>

      <td>
        <div class="actions">
          <button class="action-btn" onclick="event.stopPropagation(); window.location.href='pattern.html?id=${p.id}'">Edit</button>
          <button class="action-btn delete" onclick="event.stopPropagation(); deletePattern(${p.id})">Delete</button>
        </div>
      </td>
    `;

                list.appendChild(tr);
            });
        }

        async function deletePattern(id) {
            if (!confirm("Delete this pattern?")) return;

            const res = await fetch(`/patterns/${id}`, { method: "DELETE" });
            if (res.ok) loadPatterns();
            else alert("Failed to delete.");
        }

        window.onload = loadPatterns;

        function formatDate(sqlDate) {
            if (!sqlDate) return "";
            const d = new Date(sqlDate.replace(" ", "T")); // convert SQLite format to JS date so it's actually readable

            const options = { year: "numeric", month: "short", day: "numeric" };
            return d.toLocaleDateString("en-US", options);
        }

    </script>

</body>

</html>
