<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>View Pattern</title>
    <link rel="stylesheet" href="globals.css">

    <!-- CodeMirror 5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/mode/php/php.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/mode/css/css.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--foreground);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #555;
            margin: 0;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--primary-foreground);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #ccc;
        }

        .section {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 600;
        }

        .badge.creational {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge.structural {
            background: #d1fae5;
            color: #065f46;
        }

        .badge.behavioral {
            background: #ede9fe;
            color: #5b21b6;
        }

        img.uml {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .pattern-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        #pattern-intent {
            margin-top: 4px;
            margin-bottom: 48px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="top-bar">
            <button class="btn btn-outline" onclick="goBack()">⬅ Back</button>
            <div>
                <select id="export-format" class="btn btn-outline">
                    <option value="json">JSON</option>
                    <option value="csv">CSV</option>
                </select>

                <button class="btn btn-outline" onclick="exportPattern()">Export</button>
                <button class="btn btn-primary" onclick="editPattern()">Edit</button>
            </div>
        </div>

        <div class="pattern-header">
            <h1 id="pattern-name">Loading...</h1>
            <span id="pattern-type" class="badge"></span>
        </div>
        <p id="pattern-intent" class="subtitle"></p>

        <div class="section">
            <h3>Problem & Solution</h3>
            <p id="pattern-problem"></p>
        </div>

        <div class="section">
            <h3>Implementation</h3>
            <p id="pattern-implementation"></p>
        </div>

        <div class="section">
            <h3>UML Diagram</h3>
            <div id="uml-container"></div>
        </div>

        <div id="pattern-code-container" class="section">
            <h3>Code</h3>
            <textarea id="pattern-code"></textarea>
        </div>

        <div class="section">
            <h3>Tradeoffs</h3>
            <p id="pattern-tradeoffs"></p>
        </div>

        <div class="section">
            <h3>Uses</h3>
            <ul id="pattern-uses"></ul>
        </div>

        <div class="section">
            <h3>Metadata</h3>
            <p><strong>Author:</strong> <span id="pattern-author"></span></p>
            <p><strong>Date Created:</strong> <span id="pattern-date"></span></p>
            <p><strong>Date Last Updated:</strong> <span id="pattern-update-date"></span></p>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const patternId = params.get('id');
        let patternData;
        let codeEditor;

        function convertNewlinesToBr(text) {
            return text.replace(/\n/g, '<br>');
        }


        async function loadPattern() {
            const res = await fetch(`/patterns/${patternId}`);
            patternData = await res.json();

            document.getElementById('pattern-name').textContent = patternData.name;
            const typeEl = document.getElementById('pattern-type');
            typeEl.textContent = patternData.type;
            typeEl.className = 'badge ' + patternData.type.toLowerCase();
            document.getElementById('pattern-intent').textContent = patternData.intent;
            document.getElementById('pattern-problem').innerHTML = convertNewlinesToBr(patternData.problem) || 'N/A';
            document.getElementById('pattern-implementation').innerHTML = convertNewlinesToBr(patternData.implementation) || 'N/A';
            document.getElementById('pattern-tradeoffs').innerHTML = convertNewlinesToBr(patternData.tradeoffs) || 'N/A';
            document.getElementById('pattern-author').textContent = patternData.author || 'N/A';
            document.getElementById('pattern-date').textContent = formatDate(patternData.created_at);
            document.getElementById('pattern-update-date').textContent = formatDate(patternData.updated_at);

            // Uses list
            const usesEl = document.getElementById('pattern-uses');
            usesEl.innerHTML = '';
            let usesArray = [];
            if (typeof patternData.uses === 'string') {
                try { usesArray = JSON.parse(patternData.uses); }
                catch (e) { usesArray = [patternData.uses]; }
            } else if (Array.isArray(patternData.uses)) { usesArray = patternData.uses; }

            if (usesArray.length === 0 || (usesArray.length === 1 && usesArray[0].trim() === '')) {
                const li = document.createElement('li');
                li.textContent = 'N/A';
                li.style.fontStyle = 'italic';
                usesEl.appendChild(li);
            } else {
                usesArray.forEach(use => {
                    const li = document.createElement('li');
                    li.textContent = use;
                    usesEl.appendChild(li);
                });
            }

            // UML diagram
            const umlContainer = document.getElementById('uml-container');
            umlContainer.innerHTML = '';
            if (patternData.uml_image_path) {
                const img = document.createElement('img');
                img.src = `/uploads/${patternData.uml_image_path}`;
                img.alt = 'UML Diagram';
                img.className = 'uml';
                umlContainer.appendChild(img);
            } else {
                umlContainer.textContent = 'No UML diagram available';
            }

            // Code snippet
            const codeContainer = document.getElementById('pattern-code-container');
            const codeTextarea = document.getElementById('pattern-code');

            if (!patternData.code_snippet || patternData.code_snippet.trim() === '') {
                codeContainer.innerHTML = '<h3>Code</h3><p style="font-style:italic;">N/A</p>';
            } else {
                codeTextarea.value = patternData.code_snippet;

                let mode = patternData.code_language || 'javascript';
                if (mode === 'java') mode = 'text/x-java';
                else if (mode === 'c') mode = 'text/x-csrc';
                else if (mode === 'cpp') mode = 'text/x-c++src';
                else if (mode === 'csharp') mode = 'text/x-csharp';

                codeEditor = CodeMirror.fromTextArea(codeTextarea, {
                    lineNumbers: true,
                    mode: mode,
                    theme: 'default',
                    readOnly: true,
                    matchBrackets: true
                });

                // Copy code button
                const copyBtn = document.createElement('button');
                copyBtn.textContent = 'Copy';
                copyBtn.className = 'btn btn-outline';
                copyBtn.style.position = 'absolute';
                copyBtn.style.top = '8px';
                copyBtn.style.right = '8px';
                copyBtn.style.zIndex = 10;
                copyBtn.addEventListener('click', () => {
                    navigator.clipboard.writeText(codeEditor.getValue());
                    alert('Code copied!');
                });

                const wrapper = codeEditor.getWrapperElement();
                wrapper.style.position = 'relative';
                wrapper.appendChild(copyBtn);
            }
        }

        function goBack() { window.location.href = 'index.html'; }
        function editPattern() { window.location.href = `pattern.html?id=${patternId}`; }
        function exportPattern() {
            const format = document.getElementById('export-format').value;
            window.location.href = `/patterns/${patternId}/export?format=${format}`;
            alert('Pattern exported!');
        }
        function formatDate(dtStr) {
            const d = new Date(dtStr);
            const formattedDate = d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

            const options = {
                hour: '2-digit',
                minute: '2-digit',
                timeZone: 'America/New_York', // UTC-5 aka ETC
                hour12: true
            };
            const formattedDateTime = d.toLocaleTimeString('en-US', options);

            return `${formattedDate} at ${formattedDateTime}`;
        }

        loadPattern();
    </script>
</body>

</html>
